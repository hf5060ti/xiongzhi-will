<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="雄性意志——自然健身训练与营养定制系统。目标设定、动作百科、营养库、BMR/TDEE计算、AI教练。纯前端，数据只存本地。" />
    <meta property="og:title" content="雄性意志 - 自然健身系统" />
    <meta property="og:description" content="自然健身训练与营养定制系统。目标设定、动作百科、营养库、BMR/TDEE计算、AI教练。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./images/icon-main-192.png" />
    <link rel="apple-touch-icon" href="./images/icon-main-512.png" />
    <title>雄性意志 - 自然健身系统</title>
    <style>
      /* 首屏骨架屏：JS 加载完成前显示，避免白屏 */
      @keyframes xy-spin { to { transform: rotate(360deg); } }
      @keyframes xy-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      #xy-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        background: #0F1110;
        color: #F5F7F5;
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #xy-splash .spinner {
        width: 42px; height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(250, 204, 21, 0.22);
        border-top-color: #FACC15;
        animation: xy-spin 0.9s linear infinite;
      }
      #xy-splash .brand {
        font-size: 24px; font-weight: 800; letter-spacing: 6px;
      }
      #xy-splash .motto {
        font-size: 12px; color: #9CA3AF; max-width: 440px; line-height: 1.9;
        animation: xy-pulse 2.2s ease-in-out infinite;
      }
      #xy-splash .bar {
        width: min(320px, 70vw); height: 4px; border-radius: 2px; overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      #xy-splash .bar::after {
        content: ''; display: block; width: 40%; height: 100%;
        border-radius: 2px; background: #FACC15;
        animation: xy-load 1.2s ease-in-out infinite;
      }
      @keyframes xy-load { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
    <script defer src="./assets/index-DZ85JOZ8.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="xy-splash">
        <div class="spinner"></div>
        <div class="brand">雄性意志</div>
        <div class="bar"></div>
        <div class="motto">本网站只提供健康自然的健身方式，不提供任何极端和药物，请遵守当地法律法规</div>
      </div>
    </div>
    <script>
      // JS 加载失败兜底：10 秒后 React 仍未挂载（root 里还有骨架屏），说明 chunk 没加载出来
      // 此时把转圈换成"加载失败，点此刷新"，避免用户以为白屏/卡死
      (function () {
        var splash = document.getElementById('xy-splash');
        setTimeout(function () {
          // React 挂载后会清空 #root，骨架屏就被移除了
          if (!document.body.contains(splash)) return;
          splash.innerHTML =
            '<div class="spinner" style="border-top-color:#EF4444"></div>' +
            '<div class="brand" style="font-size:18px">加载失败</div>' +
            '<div class="motto">可能是网络问题导致核心脚本没下载完成。<br/><br/>' +
            '<a href="javascript:location.reload()" style="color:#FACC15;text-decoration:underline;cursor:pointer">点此刷新重试</a></div>';
        }, 10000);
      })();
    </script>
  </body>
</html>
