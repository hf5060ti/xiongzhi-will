<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 首屏防闪：在解析 body 之前根据 localStorage 设定 data-theme 与字号，
         避免主题闪烁和「先 18px 后用户字号」的跳变。
         注意：这里只在用户显式调过字号时才写 inline style；未自定义时留空，
         由 index.css 的媒体查询决定设备默认（桌面 18px / 手机 16px）。 -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('xy-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          d.setAttribute('data-theme', t);
          d.style.colorScheme = t;
        } catch (e) {}
        try {
          var fs = parseInt(localStorage.getItem('xy-font-size'), 10);
          if (fs >= 14 && fs <= 22) d.style.fontSize = fs + 'px';
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0a0a0a" />

    <!-- 提前与动作素材图床握手（DNS + TLS），减少首次加载图片的等待 -->
    <link rel="dns-prefetch" href="https://fitness.xingshuwen.com" />
    <link rel="preconnect" href="https://fitness.xingshuwen.com" crossorigin />
    <link rel="dns-prefetch" href="https://fitwill.app" />
    <link rel="preconnect" href="https://fitwill.app" crossorigin />

    <meta name="description" content="雄性意志——自然健身训练与营养定制系统。目标设定、动作百科、营养库、BMR/TDEE计算、AI教练。纯前端，数据只存本地。" />
    <meta property="og:title" content="雄性意志 - 自然健身系统" />
    <meta property="og:description" content="自然健身训练与营养定制系统。目标设定、动作百科、营养库、BMR/TDEE计算、AI教练。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="雄性意志" />
    <!-- 分享卡片：抓取器要求绝对 URL，统一指向实测可访问的主站 -->
    <meta property="og:image" content="https://hf5060ti.github.io/xiongzhi-will/images/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="雄性意志 —— 自然健身训练与营养定制系统" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="雄性意志 - 自然健身系统" />
    <meta name="twitter:description" content="自然健身训练与营养定制系统。目标设定、动作百科、营养库、BMR/TDEE计算、AI教练。" />
    <meta name="twitter:image" content="https://hf5060ti.github.io/xiongzhi-will/images/og-cover.png" />
    <meta name="twitter:image:alt" content="雄性意志 —— 自然健身训练与营养定制系统" />
    <!-- 规范链接 / 社交分享 URL：与 sitemap、robots 统一到实测 200 的主站。
         Gitee Pages 免费版需在后台手动重新部署，当前整站 404，暂降为备用入口。 -->
    <link rel="canonical" href="https://hf5060ti.github.io/xiongzhi-will/" />
    <meta property="og:url" content="https://hf5060ti.github.io/xiongzhi-will/" />
    <!-- 结构化数据：帮助搜索引擎识别站点与站内搜索入口（与主站一致） -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "雄性意志",
        "alternateName": "XiongZhi Will",
        "url": "https://hf5060ti.github.io/xiongzhi-will/",
        "description": "自然健身训练与营养定制系统：目标设定、动作百科、营养库、BMR/TDEE 计算与 AI 教练。",
        "inLanguage": "zh-CN",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://hf5060ti.github.io/xiongzhi-will/#/library?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/images/icon-main-192.png" />
    <link rel="apple-touch-icon" href="/images/icon-main-512.png" />
    <!-- PWA：iOS 添加到主屏幕适配 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="雄性意志" />
    <title>雄性意志 - 自然健身系统</title>
    <style>
      /* 首屏骨架屏：JS 加载完成前显示，避免白屏 */
      @keyframes xy-spin { to { transform: rotate(360deg); } }
      @keyframes xy-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      :root { --xy-splash-bg: #0F1110; --xy-splash-fg: #F5F7F5; }
      :root[data-theme="light"] { --xy-splash-bg: #F4F1EA; --xy-splash-fg: #2A2418; }
      #xy-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        background: var(--xy-splash-bg);
        color: var(--xy-splash-fg);
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #xy-splash .spinner {
        width: 42px; height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(250, 204, 21, 0.22);
        border-top-color: #FACC15;
        animation: xy-spin 0.9s linear infinite;
      }
      #xy-splash .brand {
        font-size: 24px; font-weight: 800; letter-spacing: 6px;
      }
      #xy-splash .motto {
        font-size: 12px; color: #9CA3AF; max-width: 440px; line-height: 1.9;
        animation: xy-pulse 2.2s ease-in-out infinite;
      }
      #xy-splash .bar {
        width: min(320px, 70vw); height: 4px; border-radius: 2px; overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      #xy-splash .bar::after {
        content: ''; display: block; width: 40%; height: 100%;
        border-radius: 2px; background: #FACC15;
        animation: xy-load 1.2s ease-in-out infinite;
      }
      @keyframes xy-load { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="xy-splash">
        <div class="spinner"></div>
        <div class="brand">雄性意志</div>
        <div class="bar"></div>
        <div class="motto">本网站只提供健康自然的健身方式，不提供任何极端和药物，请遵守当地法律法规</div>
      </div>
    </div>
    <script>
      // JS 加载失败兜底：8 秒后 React 仍未挂载（root 里还有骨架屏），说明 chunk 没加载出来。
      // 除了普通刷新，再给一个「清除缓存并重载」：发版后旧 Service Worker / 旧缓存
      // 卡住主脚本是最常见的打不开原因，普通刷新往往刷不掉，用户会一直卡在转圈。
      (function () {
        window.__xwHardReload = function () {
          var fired = false;
          var done = function () { if (!fired) { fired = true; location.reload(); } };
          var jobs = [];
          try {
            if ('caches' in window) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function () {}));
            }
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {}));
            }
          } catch (e) { /* 不支持缓存 API 时直接重载 */ }
          Promise.all(jobs).then(done, done);
          setTimeout(done, 3000); // 缓存 API 卡住也不能把用户困在这里
        };
        var splash = document.getElementById('xy-splash');
        var btn = 'display:inline-block;margin:6px;padding:8px 16px;border:1px solid #FACC15;' +
          'border-radius:6px;background:transparent;color:#FACC15;font:inherit;cursor:pointer';
        /*XW_FILE_GUIDE_START*/
        // file:// 直接双击打开根 index.html 时：它是 Vite 开发入口（/src/index.tsx），
        // file:// 协议下浏览器会因 CORS / 绝对路径无法加载该模块脚本，必然一直转圈直至「加载失败」。
        // 这里立即引导用户打开同目录的「桌面版/index.html」离线单文件版，避免反复看到加载失败。
        // （桌面离线版构建时会整体移除本段，因为它自身也是 file:// 打开，不能误触发引导。）
        if (location.protocol === 'file:') {
          splash.innerHTML =
            '<div class="brand" style="font-size:20px">请打开离线桌面版</div>' +
            '<div class="motto">本文件是开发入口，不能在本地直接双击打开。<br/>' +
            '请打开同目录下的 <b>桌面版 / index.html</b> 即可正常使用。<br/>' +
            '（找不到文件夹？重新解压项目压缩包，桌面版就在其中）<br/><br/>' +
            '<button type="button" style="' + btn + '" onclick="location.href=\'桌面版/index.html\'">打开离线桌面版</button></div>';
        } else
        /*XW_FILE_GUIDE_END*/
        {
          setTimeout(function () {
            // React 挂载后会清空 #root，骨架屏就被移除了
            if (!document.body.contains(splash)) return;
            splash.innerHTML =
              '<div class="spinner" style="border-top-color:#EF4444"></div>' +
              '<div class="brand" style="font-size:18px">加载失败</div>' +
              '<div class="motto">可能是网络问题或旧缓存导致核心脚本没下载完成。<br/>' +
              '先试普通刷新；还不行就清除本站缓存再重载（不会删除训练记录）。<br/><br/>' +
              '<button type="button" style="' + btn + '" onclick="location.reload()">刷新重试</button>' +
              '<button type="button" style="' + btn + '" onclick="__xwHardReload()">清除缓存并重载</button></div>';
          }, 8000);
        }
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
