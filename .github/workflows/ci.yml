name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # npm run lint = typecheck + eslint（eslint 以 --max-warnings=0 运行，warning 也会失败）
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          MIAODA_CLIENT_BASE_PATH: /xiongzhi-will/
          SKIP_MIAODA: "1"
