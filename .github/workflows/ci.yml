name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续 push 时只跑最新一次，避免重复构建占满 runner、拖慢部署。
# 与 deploy.yml 用不同 group：CI 校验和 Pages 部署互不取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # npm run lint = typecheck + eslint（eslint 以 --max-warnings=0 运行，warning 也会失败）
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          MIAODA_CLIENT_BASE_PATH: /xiongzhi-will/
          SKIP_MIAODA: "1"
      # 桌面版走同一份源码，单独构建一次，防止离线单文件/语言包内联回归
      - run: npm run build:offline
