name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          MIAODA_CLIENT_BASE_PATH: /xiongzhi-will/
      # 妙搭插件会删 dist/client，重新构建一次
      - run: npm run build
        env:
          MIAODA_CLIENT_BASE_PATH: /xiongzhi-will/
      # 用标准的 dist/client 作为 Pages 产物
      - run: |
          mkdir -p site
          cp -r dist/client/* site/
          echo '<%= htmlWebpackPlugin.options.title %>' > site/404.html || cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
